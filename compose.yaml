services:
  app:
    build: .
    ports:
      - "127.0.0.1:8502:8501"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      MAINTIDOC_ACCOUNTS: /run/secrets/accounts
      FASTEMBED_CACHE_PATH: /models
      OLLAMA_TEXT_MODEL: qwen2.5:0.5b
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_NUM_CTX: "2048"
      MAINTIDOC_LOW_MEMORY: "1"
      OMP_THREAD_LIMIT: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - corpus:/app/.maintidoc
      - ${MAINTIDOC_MODEL_CACHE:-models}:/models
    secrets:
      - accounts
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
secrets:
  accounts:
    file: ./.maintidoc/accounts.json
volumes:
  corpus:
  models:
